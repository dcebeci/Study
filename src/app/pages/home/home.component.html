<div class="home-container">
  <h1 class="page-title">Kullanıcılar</h1>

  <div class="search-wrapper">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input
      type="text"
      placeholder="İsime göre ara..."
      [(ngModel)]="searchTerm"
      (input)="onSearchTermChange(searchTerm)"
      class="search-input"
    />
  </div>

  <div *ngIf="errorMessage" class="status error">
    {{ errorMessage }}
  </div>

  <ng-container *ngIf="!errorMessage">
    <app-card-list
      [items]="(users$ | async) || []"
      (itemSelected)="navigateToDetail($event)">
    </app-card-list>

    <p class="status empty" *ngIf="(users$ | async)?.length === 0">
      Hiç kullanıcı bulunamadı.
    </p>
  </ng-container>
</div>
